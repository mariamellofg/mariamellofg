<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato Pokémon</title>

    <style>
        body {
            background-color: #eaf4ff;
            color: #23395d;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #2878d0;
            color: white;
            padding: 25px;
        }

        nav {
            background-color: #ffcb05;
            padding: 15px;
        }

        nav a {
            color: #23395d;
            margin: 10px;
            font-weight: bold;
        }

        section {
            background-color: white;
            max-width: 400px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 8px;
        }

        button {
            background-color: #ffcb05;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>💌 Contato Pokémon</h1>
        <p>Entre em contato com nosso universo!</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="galeria.html">Galeria</a>
        <a href="contato.html">Contato</a>
    </nav>

    <section>
        <h2>Fale conosco!</h2>

        <form>
            <input type="text" placeholder="Seu nome" required>

            <input type="email" placeholder="Seu e-mail" required>

            <textarea placeholder="Sua mensagem" rows="5" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </section>

</body>
</html>
